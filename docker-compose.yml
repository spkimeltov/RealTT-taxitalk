# TAXI-TALK — 외국인 탑승객 대화 실시간 통역.
#   * GPU 0 에만 붙인다(GPU 1~3 은 vLLM 이 거의 포화).
#   * vLLM 은 cdockerfile_default 네트워크에 있어 컨테이너 이름으로 호출한다.
#   * TTS 를 쓰지 않으므로 tts-api 경유 경로(host-gateway)는 필요 없다.
services:
  taxitalk-web:
    build:
      context: .
    image: taxitalk-web:latest
    container_name: taxitalk-web
    env_file:
      - .env
    ports:
      # 18090~18092 는 dutyfree·interpreter·meditalk 가 쓴다.
      - "127.0.0.1:18093:8000"
    volumes:
      # 공용 STT 컨테이너가 이미 갖고 있는 whisper 가중치를 읽기 전용으로 공유한다.
      # (large-v3 약 2.9GB — 같은 모델을 다시 내려받지 않는다)
      - /home/aiuser/stt-api/models:/models/shared:ro
      # 여기 없는 모델을 쓰게 될 때를 위한 쓰기 가능 캐시.
      - ./models:/root/.cache/huggingface
      # 대화기록. 컨테이너를 다시 만들어도 남아 있어야 한다.
      - ./data:/srv/taxitalk/data
    extra_hosts:
      # 서비스 자체는 TTS 를 쓰지 않는다. deploy/e2e_test.py 가 시험용 발화를
      # 합성할 때만 이 경로로 tts-api(nginx 0.0.0.0:8084)에 닿는다.
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - cdockerfile_default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

networks:
  cdockerfile_default:
    external: true
