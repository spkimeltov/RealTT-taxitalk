    # BEGIN taxitalk — 외국인 고객 대화 통역 (https://ai.tovair.com:48443/demo/taxitalk/)
    location = /demo/taxitalk {
        return 301 https://$host:48443/demo/taxitalk/;
    }

    location /demo/taxitalk/ {
        proxy_pass http://taxitalk_web/;
        proxy_http_version 1.1;

        # /ws/session WebSocket 업그레이드
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /demo/taxitalk;

        # 오디오 업스트림을 버퍼링 없이 즉시 흘려보낸다.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # 대화 세션은 마이크를 계속 열어 둔 채 오래 유지된다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # END taxitalk
